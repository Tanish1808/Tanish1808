<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" width="100%" height="280">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F17" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#070A10" />
    </linearGradient>
    <linearGradient id="lineAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F5A0" stop-opacity="0" />
      <stop offset="30%" stop-color="#00F5A0" stop-opacity="0.8" />
      <stop offset="70%" stop-color="#38BDF8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="280" rx="12" fill="url(#bgGrad)" stroke="#1F293D" stroke-width="1.5" />

  <!-- Corner Labels -->
  <text x="35" y="42" fill="#475569" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" letter-spacing="1.5">// CORE_SYSTEM: ACTIVE</text>
  <text x="1165" y="42" text-anchor="end" fill="#475569" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" letter-spacing="1.5">AHMEDABAD, IN</text>

  <!-- Status Pill -->
  <rect x="485" y="32" width="230" height="28" rx="14" fill="#0F172A" stroke="#334155" stroke-width="1" />
  <circle cx="503" cy="46" r="4" fill="#00F5A0" />
  <text x="517" y="50" fill="#00F5A0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="1.5">SYSTEM ARCHITECT</text>

  <!-- Main Name Title -->
  <text x="600" y="128" text-anchor="middle" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Roboto, sans-serif" font-size="54" font-weight="800" letter-spacing="6">TANISH SHAH</text>

  <!-- Subtitle Specialization -->
  <text x="600" y="170" text-anchor="middle" fill="#38BDF8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600" letter-spacing="3.5">FULL-STACK &bull; BACKEND ARCHITECTURES &bull; APPLIED ML</text>

  <!-- Description Line -->
  <text x="600" y="206" text-anchor="middle" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="400" letter-spacing="0.5">Engineering deterministic multi-tier systems, stateless security models, and spatial pipelines.</text>

  <!-- Accent Divider Line -->
  <rect x="300" y="235" width="600" height="2" rx="1" fill="url(#lineAccent)" />

  <!-- Bottom Labels -->
  <text x="35" y="258" fill="#475569" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" letter-spacing="1">STACK: PYTHON &bull; JAVA &bull; SQL &bull; JS</text>
  <text x="1165" y="258" text-anchor="end" fill="#475569" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" letter-spacing="1">STATUS: PURSUING_B.E.</text>
</svg>
