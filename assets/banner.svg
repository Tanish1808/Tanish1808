<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070A10" />
      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#070A10" />
    </linearGradient>

    <!-- Text Header Gradient -->
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="60%" stop-color="#F8FAFC" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>

    <!-- Accent Divider Gradient -->
    <linearGradient id="dividerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0" />
      <stop offset="25%" stop-color="#38BDF8" stop-opacity="0.9" />
      <stop offset="75%" stop-color="#00E5A0" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#00E5A0" stop-opacity="0" />
    </linearGradient>

    <!-- Dot Grid Pattern -->
    <pattern id="dotGrid" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#334155" fill-opacity="0.4" />
    </pattern>
  </defs>

  <!-- Outer Frame -->
  <rect width="1200" height="320" rx="16" fill="url(#bgGrad)" stroke="#1E293B" stroke-width="1.5" />

  <!-- Background Grid -->
  <rect width="1200" height="320" rx="16" fill="url(#dotGrid)" />

  <!-- Header Corner Metadata -->
  <text x="40" y="44" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" letter-spacing="1.5">// IT_ENGINEERING_CORE</text>
  <text x="1160" y="44" text-anchor="end" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" letter-spacing="1.5">AHMEDABAD, IN</text>

  <!-- Active Status Pill -->
  <g transform="translate(480, 32)">
    <rect x="0" y="0" width="240" height="28" rx="14" fill="#0B132B" stroke="#1E293B" stroke-width="1" />
    <circle cx="16" cy="14" r="4" fill="#00E5A0" />
    <text x="28" y="18" fill="#00E5A0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="1.5">SYSTEM ARCHITECT</text>
  </g>

  <!-- Main Identity Typography -->
  <text x="600" y="146" text-anchor="middle" fill="url(#headerGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Roboto, sans-serif" font-size="62" font-weight="900" letter-spacing="7">TANISH SHAH</text>

  <!-- Subtitle Line -->
  <text x="600" y="190" text-anchor="middle" fill="#38BDF8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600" letter-spacing="4">FULL-STACK &bull; BACKEND ARCHITECTURES &bull; APPLIED ML</text>

  <!-- Description / Ethos -->
  <text x="600" y="228" text-anchor="middle" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="400" letter-spacing="0.8">Engineering deterministic multi-tier systems, stateless security models, and spatial pipelines.</text>

  <!-- Accent Divider -->
  <rect x="250" y="258" width="700" height="2" rx="1" fill="url(#dividerGrad)" />

  <!-- Bottom Corner Metadata -->
  <text x="40" y="294" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" letter-spacing="1">STACK: PYTHON &bull; JAVA &bull; SQL &bull; JS</text>
  <text x="1160" y="294" text-anchor="end" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" letter-spacing="1">STATUS: PURSUING_B.E.</text>
</svg>
