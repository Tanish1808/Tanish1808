<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07090E" />
      <stop offset="40%" stop-color="#0D111A" />
      <stop offset="80%" stop-color="#121826" />
      <stop offset="100%" stop-color="#07090E" />
    </linearGradient>

    <!-- Glowing Accent Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F5A0" />
      <stop offset="50%" stop-color="#00D2FF" />
      <stop offset="100%" stop-color="#7928CA" />
    </linearGradient>

    <!-- Subtitle Gradient -->
    <linearGradient id="subGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E2E8F0" />
      <stop offset="100%" stop-color="#94A3B8" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1E293B" stroke-width="0.75" stroke-opacity="0.4" />
      <circle cx="40" cy="40" r="1" fill="#00F5A0" fill-opacity="0.3" />
    </pattern>
  </defs>

  <style>
    .title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Inter', sans-serif;
      font-weight: 900;
      font-size: 58px;
      letter-spacing: 6px;
      fill: url(#accentGrad);
    }
    .role {
      font-family: 'SF Mono', 'Fira Code', 'Roboto Mono', monospace;
      font-weight: 600;
      font-size: 18px;
      letter-spacing: 3px;
      fill: #38BDF8;
    }
    .tagline {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Inter', sans-serif;
      font-weight: 400;
      font-size: 16px;
      letter-spacing: 1.5px;
      fill: #94A3B8;
    }
    .badge-text {
      font-family: 'SF Mono', 'Fira Code', monospace;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 1px;
      fill: #00F5A0;
    }
  </style>

  <!-- Background Rect -->
  <rect width="1200" height="320" rx="16" fill="url(#bgGrad)" stroke="#1E293B" stroke-width="1.5" />

  <!-- Subtle Grid Overlay -->
  <rect width="1200" height="320" rx="16" fill="url(#grid)" />

  <!-- Ambient Light Circles -->
  <circle cx="150" cy="80" r="140" fill="#00F5A0" opacity="0.06" filter="url(#glow)" />
  <circle cx="1050" cy="240" r="160" fill="#00D2FF" opacity="0.06" filter="url(#glow)" />
  <circle cx="600" cy="160" r="180" fill="#7928CA" opacity="0.04" filter="url(#glow)" />

  <!-- Top Status Pill -->
  <g transform="translate(480, 42)">
    <rect x="0" y="0" width="240" height="28" rx="14" fill="#0D1524" stroke="#00F5A0" stroke-width="1" stroke-opacity="0.4" />
    <circle cx="18" cy="14" r="4" fill="#00F5A0" filter="url(#glow)" />
    <text x="32" y="18" class="badge-text">● AVAILABLE FOR ROLES</text>
  </g>

  <!-- Main Name Title -->
  <text x="600" y="142" text-anchor="middle" class="title" filter="url(#glow)">TANISH SHAH</text>

  <!-- Roles -->
  <text x="600" y="188" text-anchor="middle" class="role">FULL-STACK DEVELOPER &bull; BACKEND ARCHITECT &bull; APPLIED ML</text>

  <!-- Tagline -->
  <text x="600" y="228" text-anchor="middle" class="tagline">Engineering Deterministic Backends &bull; Stateless Auth &bull; Scalable Data Pipelines</text>

  <!-- Bottom Accent Line -->
  <rect x="350" y="265" width="500" height="2" rx="1" fill="url(#accentGrad)" opacity="0.8" filter="url(#glow)" />

  <!-- Corner Tech Markers -->
  <text x="30" y="45" font-family="monospace" font-size="12" fill="#334155">// SYS_CORE: ACTIVE</text>
  <text x="1170" y="45" text-anchor="end" font-family="monospace" font-size="12" fill="#334155">LOC: AHMEDABAD, IN</text>
  <text x="30" y="295" font-family="monospace" font-size="12" fill="#334155">LATENCY: &lt;50ms</text>
  <text x="1170" y="295" text-anchor="end" font-family="monospace" font-size="12" fill="#334155">V_NODE: 2024-2028</text>
</svg>
